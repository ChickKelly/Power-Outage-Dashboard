{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Power Map</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    html, body {
        height: 100%;
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background-color: #f4f6f9;
    }
    #map {
        width: 100%;
        height: 100vh;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    /* Custom Google Map InfoWindow styling */
    .gm-style .gm-style-iw-c {
        padding: 10px !important;
        border-radius: 10px;
    }
    .gm-style .gm-style-iw-d {
        overflow: hidden !important;
    }
</style>
</head>
<body>

<div id="map"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function initMap() {
    // Initialize the map centered on Cameroon
    const cameroonCenter = { lat: 3.848, lng: 11.5021 };
    const map = new google.maps.Map(document.getElementById("map"), {
        center: cameroonCenter,
        zoom: 6,
        mapId: "community_map",
        styles: [
            { elementType: "geometry", stylers: [{ color: "#ebe3cd" }] },
            { elementType: "labels.text.fill", stylers: [{ color: "#523735" }] },
            { elementType: "labels.text.stroke", stylers: [{ color: "#f5f1e6" }] },
            {
                featureType: "administrative",
                elementType: "geometry.stroke",
                stylers: [{ color: "#c9b2a6" }]
            },
            {
                featureType: "water",
                elementType: "geometry.fill",
                stylers: [{ color: "#b9d3c2" }]
            },
            {
                featureType: "water",
                elementType: "labels.text.fill",
                stylers: [{ color: "#92998d" }]
            }
        ]
    });

    // Django data
    const communities = [
        {% for community in communities %}
        {
            name: "{{ community.name|escapejs }}",
            voltage: {{ community.voltage|default:0 }},
            status: "{{ community.power_status }}",
            lat: {{ community.latitude|default:0 }},
            lng: {{ community.longitude|default:0 }}
        },
        {% endfor %}
    ];

    // Add markers for each community
    communities.forEach(c => {
        if (c.lat && c.lng) {
            let color = "gray";
            if (c.status === "Online") color = "green";
            else if (c.status === "Offline") color = "red";
            else if (c.status === "Voltage Issue" || c.voltage < 20 || c.voltage > 240) color = "orange";

            const marker = new google.maps.Marker({
                position: { lat: c.lat, lng: c.lng },
                map,
                title: c.name,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 8,
                    fillColor: color,
                    fillOpacity: 1,
                    strokeColor: "#000",
                    strokeWeight: 1
                }
            });

            const infoWindow = new google.maps.InfoWindow({
                content: `
                    <div style="font-size:14px; line-height:1.6;">
                        <strong>${c.name}</strong><br>
                        Voltage: ${c.voltage} V<br>
                        Status: <span style="color:${color}; font-weight:bold;">${c.status}</span>
                    </div>
                `
            });

            marker.addListener("click", () => {
                infoWindow.open(map, marker);
            });
        }
    });
}
</script>

<!-- Load Google Maps API (replace YOUR_API_KEY) -->
<script async
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
</script>

</body>
</html>
