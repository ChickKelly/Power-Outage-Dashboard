{% extends 'outages/base.html' %}

{% block title %}Add City{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Add New City</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
