{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-20 bg-white shadow-md rounded-xl p-6 text-center">
  <h2 class="text-2xl font-semibold mb-4 text-gray-800">Delete Community</h2>
  <p class="text-gray-600 mb-6">
    Are you sure you want to delete <strong>{{ community.name }}</strong>?
  </p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg mr-2">Yes, Delete</button>
    <a href="{% url 'community_list' %}" class="bg-gray-300 hover:bg-gray-400 text-black px-4 py-2 rounded-lg">Cancel</a>
  </form>
</div>
{% endblock %}
